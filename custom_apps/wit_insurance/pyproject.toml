[project]
name = "wit_insurance"
authors = [
    { name = "We Insure Things", email = "logan@weinsurethings.com" }
]
description = "WIT insurance CRM customizations for ERPNext/Frappe"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=17.0.0-dev,<18.0.0"
erpnext = ">=17.0.0-dev,<18.0.0"

[project.urls]
Homepage = "https://weinsurethings.com"
Repository = "https://github.com/Yothisislogan/erpnext"
